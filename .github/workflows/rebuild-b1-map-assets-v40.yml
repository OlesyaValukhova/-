name: Rebuild B1 map assets v40

on:
  push:
    branches:
      - codex/presentation-browser-qa-v40
    paths:
      - 'presentation/map_sources/maps_b1_v25.py'
      - 'presentation/map_sources/build_b1_paired_delta_map_v40.py'
      - 'presentation/map_sources/verify_paired_delta_map_v40.py'
      - 'presentation/map_sources/verify_b1_map_assets_v40.py'
      - 'presentation/map_sources/blocks_v22.json.gz.b64'
      - 'presentation/map_sources/b1_81.csv'
      - 'presentation/map_sources/b1_38.csv'
      - '.github/workflows/rebuild-b1-map-assets-v40.yml'

concurrency:
  group: b1-map-assets-v40-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas matplotlib
      - name: Rebuild state, delta and coverage maps
        run: python presentation/map_sources/maps_b1_v25.py
      - name: Rebuild paired programming and art map
        run: python presentation/map_sources/build_b1_paired_delta_map_v40.py
      - name: Verify all generated maps
        run: |
          python presentation/map_sources/verify_b1_map_assets_v40.py
          python presentation/map_sources/verify_paired_delta_map_v40.py
      - name: Commit compressed vector sources, PNG maps and audits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f presentation/assets_v40/*.svg || true
          git add presentation/assets_v40/*.svgz presentation/assets_v40/*.png presentation/map_sources/coverage_audit_v40.json presentation/map_sources/paired_delta_map_audit_v40.json
          if ! git diff --cached --quiet; then
            git commit -m "Build comparable B1 map assets v40"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
