<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Распределение доли жилых точек с хотя бы одной координатой по 43 направлениям и трём временным порогам</title><desc id="desc">Шесть горизонтальных boxplot. Коробки показывают межквартильный размах по 43 направлениям, вертикальная линия — медиану, усики — минимум и максимум. Для обоих возрастов медиана повышается при увеличении времени пешком.</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="38" y="58" font-family="Arial,sans-serif" font-size="38" font-weight="650" fill="#263e48">Распределение по направлениям, а не одна городская доля</text><text x="38" y="92" font-family="Arial,sans-serif" font-size="19" fill="#5e6d73">Доля жилых точек с ≥1 опубликованной координатой · 43 направления · B1</text><rect x="40" y="128" width="18" height="18" rx="2" fill="#b86c5d"/><text x="68" y="143" font-family="Arial,sans-serif" font-size="16" fill="#344e57">7 лет</text><rect x="145" y="128" width="18" height="18" rx="2" fill="#315b78"/><text x="173" y="143" font-family="Arial,sans-serif" font-size="16" fill="#344e57">13 лет</text><line x1="320" y1="137" x2="370" y2="137" stroke="#607078" stroke-width="2"/><rect x="336" y="129" width="18" height="16" fill="#dce4e5" stroke="#607078"/><line x1="345" y1="128" x2="345" y2="146" stroke="#263e48" stroke-width="2"/><text x="382" y="143" font-family="Arial,sans-serif" font-size="15" fill="#52636b">усики: min–max · коробка: Q1–Q3 · линия: медиана</text><line x1="340" y1="210" x2="340" y2="790" stroke="#e7ecec" stroke-width="1"/><text x="340" y="817" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#69777c">0%</text><line x1="592.5" y1="210" x2="592.5" y2="790" stroke="#e7ecec" stroke-width="1"/><text x="592.5" y="817" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#69777c">25%</text><line x1="845" y1="210" x2="845" y2="790" stroke="#e